name: Build AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip web project
        run: |
          rm -rf project
          mkdir project
          unzip -q "royal-teen-patti (1).zip" -d project

      - name: Find web project
        run: |
          if [ -f "project/package.json" ]; then
            echo "Project found in project/"
          elif [ -f "project/project/package.json" ]; then
            echo "Project found in project/project/"
            mv project/project/* project/
            mv project/project/.[!.]* project/ 2>/dev/null || true
          else
            echo "package.json not found"
            find project -maxdepth 3 -name package.json -print
            exit 1
          fi

      - name: Install dependencies
        working-directory: project
        run: npm install

      - name: Install Capacitor
        working-directory: project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web app
        working-directory: project
        run: npm run build

      - name: Create Capacitor config
        working-directory: project
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.royalteenpatti.app',
            appName: 'Royal Teen Patti',
            webDir: 'dist'
          };

          export default config;
          EOF

      - name: Add Android
        working-directory: project
        run: npx cap add android

      - name: Sync Android
        working-directory: project
        run: npx cap sync android

      - name: Build AAB
        working-directory: project/android
        run: ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: royal-teen-patti-aab
          path: project/android/app/build/outputs/bundle/release/*.aab

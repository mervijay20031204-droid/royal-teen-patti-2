name: Build AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q "royal-teen-patti (1).zip" -d project

      - name: Find Android project
        id: android
        run: |
          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "Android project settings.gradle not found"
            find project -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found in: $DIR"

      - name: Check Gradle
        run: |
          gradle --version

      - name: Build AAB
        run: |
          cd "${{ steps.android.outputs.dir }}"
          gradle bundleRelease --no-daemon

      - name: Find AAB
        run: |
          find project -type f -name "*.aab" -print

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: royal-teen-patti-aab
          path: project/**/*.aab
